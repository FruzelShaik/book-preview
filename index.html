<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Preview - First 2 Pages</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f596a9, #f5d1d4);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 2.8rem;
    text-align: center;
    color: #fff;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 50px;
  }

  canvas {
    display: block;
    margin: 30px auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    border-radius: 12px;
    max-width: 90%;
    height: auto;
    transition: transform 0.3s;
  }
  canvas:hover {
    transform: scale(1.02);
  }

  @media(max-width: 768px){
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<h1>📖 Dive Into Your Next Favorite Book – First 2 Pages Preview!
</h1>
<div id="pdf-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

const url = "mybook.pdf"; // PDF file must be in the same folder as index.html
const container = document.getElementById("pdf-container");

pdfjsLib.getDocument(url).promise.then(pdf => {
  const totalPages = pdf.numPages;
  const pagesToShow = Math.min(2, totalPages);

  for (let pageNum = 1; pageNum <= pagesToShow; pageNum++) {
    pdf.getPage(pageNum).then(page => {
      const viewport = page.getViewport({scale: 1.5});
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      page.render({canvasContext: ctx, viewport});
      container.appendChild(canvas);
    });
  }

}).catch(err => {
  container.innerHTML = `<p style="color:red;">❌ ERROR: ${err.message}</p>`;
});
</script>

</body>
</html>
