<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Preview</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f596a9, #f5d1d4);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 2.8rem;
    text-align: center;
    color: #fff;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 50px;
  }

  canvas {
    display: block;
    margin: 30px auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    border-radius: 12px;
    max-width: 90%;
    height: auto;
    transition: transform 0.3s;
  }
  canvas:hover {
    transform: scale(1.02);
  }

  .lock-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 420px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    flex-direction: column;
    margin: 30px auto;
    max-width: 650px;
    text-align: center;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }

  .buy-button {
    margin-top: 25px;
    padding: 16px 35px;
    background: #ff4d6d;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    border-radius: 12px;
    transition: 0.3s;
  }

  .buy-button:hover {
    background: #e63950;
  }

  @media(max-width: 768px){
    h1 { font-size: 2rem; }
    .lock-overlay { height: 320px; font-size: 18px; }
    .buy-button { font-size: 16px; padding: 14px 28px; }
  }
</style>
</head>
<body>

<h1>📖 Preview Our Amazing Book</h1>
<div id="pdf-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

const url = "mybook.pdf"; // PDF must be in the same folder as index.html
const container = document.getElementById("pdf-container");

pdfjsLib.getDocument(url).promise.then(pdf => {
  const totalPages = pdf.numPages;

  // Render first 2 pages as preview
  for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
    if (pageNum <= 2) {
      pdf.getPage(pageNum).then(page => {
        const viewport = page.getViewport({scale: 1.5});
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        page.render({canvasContext: ctx, viewport});
        container.appendChild(canvas);
      });
    } else {
      // Lock everything from page 3 onward
      const lockDiv = document.createElement("div");
      lockDiv.className = "lock-overlay";
      lockDiv.innerHTML = `
        🔒 Remaining pages are locked!<br>
        <a class="buy-button" href="https://yourbookpage.com" target="_blank">Buy Full Book</a>
      `;
      container.appendChild(lockDiv);
      break; // Stop rendering further pages
    }
  }
}).catch(err => {
  container.innerHTML = `<p style="color:red;">❌ ERROR: ${err.message}</p>`;
});
</script>

</body>
</html>
